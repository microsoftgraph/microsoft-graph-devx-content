name: Validate sample queries
on:
  workflow_dispatch:

  push:
    paths:
      - sample-queries/sample-queries.json
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json

  pull_request:
    paths:
      - sample-queries/sample-queries.json
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json

jobs:
  validate-json-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate JSON schema
        uses: dsanders11/json-schema-validate-action@79b2d95a446a0d786f7f244ae7764f8370ff3657 # v1.4.0
        with:
          schema: tests/samples.schema.json
          files: sample-queries/sample-queries.json

  test:
    runs-on: ubuntu-latest
    needs: validate-json-schema
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install
        run: npm install

      - name: Run test
        run: npm run test
