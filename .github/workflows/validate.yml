name: Validate sample queries
on:
  workflow_dispatch:

  push:
    paths:
      - sample-queries/sample-queries.json
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json

  pull_request:
    paths:
      - sample-queries/sample-queries.json
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json

jobs:
  validate-json-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON schema
        uses: dsanders11/json-schema-validate-action@f04ef3bca791388d2bd9ff3a50b27d1b2572158e # v2.1.0
        with:
          schema: tests/samples.schema.json
          files: sample-queries/sample-queries.json

  test:
    runs-on: ubuntu-latest
    needs: validate-json-schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        run: npm install

      - name: Run test
        run: npm run test
